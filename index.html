<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Keep Them Out!</title>
  <meta name="description" content="Defend Bangladesh's border! Tap the intruders sneaking in from India before they cross the map.">
  <meta name="theme-color" content="#0b1d16">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keep Them Out">
  <!-- Link previews (Facebook / WhatsApp / X). og:image must be an absolute URL.
       Rebuild the image with: node tools/cdp.mjs tools/og-image.mjs -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mrashidbd.github.io/hasina-game/">
  <meta property="og:site_name" content="ঢুকতে দেবো না! · Keep Them Out!">
  <meta property="og:title" content="ঢুকতে দেবো না! · Keep Them Out!">
  <meta property="og:description" content="ওরা বারবার বলে ফিরে আসবে। আমরা বারবার লাথি মেরে ফেরত পাঠাই! ফ্রি খেলো, স্কোর শেয়ার করো। · They keep saying they're coming back. We keep kicking them out!">
  <meta property="og:image" content="https://mrashidbd.github.io/hasina-game/icons/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A farmer kicks Hasina back out of Bangladesh">
  <meta property="og:locale" content="bn_BD">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://mrashidbd.github.io/hasina-game/icons/og-image.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Game map"></canvas>

  <!-- HUD -->
  <header id="hud" class="hidden">
    <div class="stat"><small data-i18n="hudScore">SCORE</small><b id="score">0</b></div>
    <div class="stat"><small id="waveLbl" data-i18n="hudWave">WAVE</small><b id="wave">1</b></div>
    <div class="stat lassoOnly"><small data-i18n="hudLocked">JAILED</small><b id="locked">0</b></div>
    <div class="stat lassoOnly"><small data-i18n="hudLives">LIVES</small><b id="lives">❤️❤️❤️</b></div>
    <div class="mid"><span id="combo"></span><i id="comboBar"></i><span id="shield"></span></div>
    <button id="dirBtn" class="icon lassoOnly" aria-label="Reverse direction">⇄</button>
    <button id="muteBtn" class="icon" aria-label="Toggle sound">🔊</button>
    <button id="pauseBtn" class="icon" aria-label="Pause">⏸</button>
  </header>

  <div id="banner"><div id="bannerTitle"></div><div id="bannerSub"></div></div>

  <!-- Menu -->
  <section id="menu" class="screen">
    <div class="panel">
      <div class="logo">🛡️🇧🇩</div>
      <h1 data-i18n="title">Keep Them Out!</h1>
      <p class="tag" data-i18n="tagline"></p>
      <button id="playBtn" class="primary" data-i18n="play">▶ KEEP THEM OUT</button>
      <button id="playLassoBtn" class="primary" data-i18n="playLasso">🪢 ROPE 'EM!</button>
      <button id="howBtn" data-i18n="how">How to play &amp; points</button>
      <button id="installBtn" class="hidden" data-i18n="install">📲 Install app</button>
      <p id="iosHint" class="hint hidden" data-i18n="iosHint"></p>
      <p id="bestLine" class="best"></p>
      <button id="langBtn" class="lang" data-i18n="langBtn">বাংলা</button>
      <p class="hint" data-i18n="disclaimer"></p>
    </div>
  </section>

  <!-- Hero select -->
  <section id="heroSelect" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="heroTitle">Choose your champion</h2>
      <div id="heroGrid" class="heroGrid"></div>
      <button id="startBtn" class="primary" data-i18n="start">▶ Start</button>
    </div>
  </section>

  <!-- Instant play / challenge link (?play= / ?c=&k=&m=) -->
  <section id="quick" class="screen hidden">
    <div class="panel">
      <div class="logo">🛡️🇧🇩</div>
      <h1 data-i18n="title"></h1>
      <p id="quickText" class="tag"></p>
      <button id="quickPlay" class="primary" data-i18n="quickPlay">▶ PLAY NOW</button>
      <button id="quickMenu" data-i18n="menu">Menu</button>
    </div>
  </section>

  <!-- How to play -->
  <section id="howto" class="screen hidden">
    <div class="panel scroll">
      <h2 data-i18n="howTitle">How to play</h2>
      <ul class="rules" id="rules"></ul>
      <h3 data-i18n="intruders">Intruders</h3>
      <div id="roster" class="table"></div>
      <h3><span data-i18n="powerups">Power-ups</span> <small data-i18n="tapCollect">(tap to collect)</small></h3>
      <div id="powers" class="table"></div>
      <h3 data-i18n="lHowTitle">Rope 'Em! mode</h3>
      <ul class="rules" id="lRules"></ul>
      <p class="hint" data-i18n="keys"></p>
      <button id="howBack" class="primary" data-i18n="gotIt">Got it</button>
    </div>
  </section>

  <!-- Pause -->
  <section id="pause" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="paused">Paused</h2>
      <button id="resumeBtn" class="primary" data-i18n="resume">▶ Resume</button>
      <button id="quitBtn" data-i18n="quit">Quit to menu</button>
    </div>
  </section>

  <!-- Game over -->
  <section id="over" class="screen hidden">
    <div class="panel">
      <h2 id="overTitle" class="bad">BORDER BREACHED!</h2>
      <p id="overHeadline" class="headline"></p>
      <p id="overReason" class="tag"></p>
      <div class="bigscore" id="overScore">0</div>
      <p id="overVs" class="vs hidden"></p>
      <div class="scoreMeta">
        <span id="overRank" class="rankPill"></span>
        <span id="overRecord" class="record hidden" data-i18n="record">🏆 NEW RECORD!</span>
      </div>
      <img id="cardPreview" class="cardPreview hidden" alt="">
      <!-- Share first (it's the point of the game), then replay; stats are secondary. -->
      <button id="shareBtn" class="primary" data-i18n="shareImg">📤 Share my result</button>
      <div class="shareRow">
        <button id="waBtn" data-i18n="shareWa">WhatsApp</button>
        <button id="fbBtn" data-i18n="shareFb">Facebook</button>
        <button id="storyBtn" data-i18n="shareStory">Story image</button>
      </div>
      <button id="againBtn" class="primary" data-i18n="again">↻ Play again</button>
      <div id="overStats" class="stats"></div>
      <div class="shareRow">
        <button id="heroChangeBtn" data-i18n="changeHero">Change hero</button>
        <button id="menuBtn" data-i18n="menu">Menu</button>
      </div>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
