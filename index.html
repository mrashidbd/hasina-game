<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Keep Them Out!</title>
  <meta name="description" content="Defend Bangladesh's border! Tap the intruders sneaking in from India before they cross the map.">
  <meta name="theme-color" content="#0b1d16">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keep Them Out">
  <meta property="og:title" content="Keep Them Out!">
  <meta property="og:description" content="Defend Bangladesh's border — how many waves can you hold?">
  <meta property="og:image" content="icons/icon-512.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Game map"></canvas>

  <!-- HUD -->
  <header id="hud" class="hidden">
    <div class="stat"><small data-i18n="hudScore">SCORE</small><b id="score">0</b></div>
    <div class="stat"><small id="waveLbl" data-i18n="hudWave">WAVE</small><b id="wave">1</b></div>
    <div class="stat lassoOnly"><small data-i18n="hudLocked">JAILED</small><b id="locked">0</b></div>
    <div class="stat lassoOnly"><small data-i18n="hudLives">LIVES</small><b id="lives">❤️❤️❤️</b></div>
    <div class="mid"><span id="combo"></span><i id="comboBar"></i><span id="shield"></span></div>
    <button id="dirBtn" class="icon lassoOnly" aria-label="Reverse direction">⇄</button>
    <button id="muteBtn" class="icon" aria-label="Toggle sound">🔊</button>
    <button id="pauseBtn" class="icon" aria-label="Pause">⏸</button>
  </header>

  <button id="sweepBtn" class="hidden" aria-label="Sweep — catch everyone on screen">
    <span id="sweepFill"></span><span class="lbl" data-i18n="sweep">⚡ SWEEP</span>
  </button>

  <div id="banner"><div id="bannerTitle"></div><div id="bannerSub"></div></div>

  <!-- Menu -->
  <section id="menu" class="screen">
    <div class="panel">
      <div class="logo">🛡️🇧🇩</div>
      <h1 data-i18n="title">Keep Them Out!</h1>
      <p class="tag" data-i18n="tagline"></p>
      <button id="playBtn" class="primary" data-i18n="play">▶ KEEP THEM OUT</button>
      <button id="playLassoBtn" class="primary" data-i18n="playLasso">🪢 ROPE 'EM!</button>
      <button id="howBtn" data-i18n="how">How to play &amp; points</button>
      <button id="installBtn" class="hidden" data-i18n="install">📲 Install app</button>
      <p id="iosHint" class="hint hidden" data-i18n="iosHint"></p>
      <p id="bestLine" class="best"></p>
      <button id="langBtn" class="lang" data-i18n="langBtn">বাংলা</button>
      <p class="hint" data-i18n="disclaimer"></p>
    </div>
  </section>

  <!-- Hero select -->
  <section id="heroSelect" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="heroTitle">Choose your champion</h2>
      <div id="heroGrid" class="heroGrid"></div>
      <button id="startBtn" class="primary" data-i18n="start">▶ Start</button>
    </div>
  </section>

  <!-- How to play -->
  <section id="howto" class="screen hidden">
    <div class="panel scroll">
      <h2 data-i18n="howTitle">How to play</h2>
      <ul class="rules" id="rules"></ul>
      <h3 data-i18n="intruders">Intruders</h3>
      <div id="roster" class="table"></div>
      <h3><span data-i18n="powerups">Power-ups</span> <small data-i18n="tapCollect">(tap to collect)</small></h3>
      <div id="powers" class="table"></div>
      <h3 data-i18n="lHowTitle">Rope 'Em! mode</h3>
      <ul class="rules" id="lRules"></ul>
      <p class="hint" data-i18n="keys"></p>
      <button id="howBack" class="primary" data-i18n="gotIt">Got it</button>
    </div>
  </section>

  <!-- Pause -->
  <section id="pause" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="paused">Paused</h2>
      <button id="resumeBtn" class="primary" data-i18n="resume">▶ Resume</button>
      <button id="quitBtn" data-i18n="quit">Quit to menu</button>
    </div>
  </section>

  <!-- Upgrade choice (between waves) -->
  <section id="perk" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="perkTitle">Choose an upgrade</h2>
      <p id="perkSub" class="tag"></p>
      <div id="perkList" class="perks"></div>
    </div>
  </section>

  <!-- Game over -->
  <section id="over" class="screen hidden">
    <div class="panel">
      <h2 id="overTitle" class="bad" data-i18n="breached">BORDER BREACHED!</h2>
      <p id="overReason" class="tag"></p>
      <div class="bigscore" id="overScore">0</div>
      <div id="overRecord" class="record hidden" data-i18n="record">🏆 NEW RECORD!</div>
      <div id="overStats" class="stats"></div>
      <button id="againBtn" class="primary" data-i18n="again">↻ Play again</button>
      <button id="shareBtn" data-i18n="share">Share score</button>
      <button id="menuBtn" data-i18n="menu">Menu</button>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
